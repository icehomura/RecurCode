services:
  rc:
    build: .
    # Or use a pre-built image:
    # image: xintaofei/codeg:latest
    ports:
      - "3080:3080"
      # Port bridge for dev servers started by agents inside the container:
      # the workbench shows `http://localhost:3000` from the container through
      # one of these ports (one per dev server). Publish the same range you set
      # in RC_BRIDGE_PORTS (default: the ten ports after RC_PORT).
      # Drop this line if you set RC_BRIDGE_HOST_PATTERN below.
      - "3081-3090:3081-3090"
    volumes:
      - rc-data:/data
      # Mount your project directories (optional):
      # - /path/to/projects:/projects
    environment:
      - RC_TOKEN=${RC_TOKEN:-}
      - RC_PORT=3080
      - RC_HOST=0.0.0.0
      # - RC_BRIDGE_PORTS=3081-3090   # or `off` to disable the port bridge
      # Name the dev servers by hostname instead of giving each one a port:
      # `3000.recurcode.example.com` reaches the container's port 3000 over the
      # published 3080, so nothing above has to be published and no range has
      # to be guessed. Needs a wildcard DNS record for the name and, behind a
      # reverse proxy, a wildcard vhost pointing at this service and passing
      # `Host` through (Caddy: `*.recurcode.example.com { reverse_proxy rc:3080 }`).
      # `auto` puts the port one label in front of whatever host the workbench
      # itself was opened at.
      # - RC_BRIDGE_HOST_PATTERN=auto
    # In-place upgrades (Settings → Software Update) rewrite the binaries and
    # web assets inside this container's writable layer, not the image. The
    # rc-data volume persists, but an upgrade lives only in the running
    # container: recreating it (`--force-recreate`, or recreating after a
    # `docker pull`) starts from the image again and drops the upgrade. Build or
    # pull an image at the new version and recreate to make it permanent.
    restart: unless-stopped

volumes:
  rc-data:
