<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    Full-bleed on purpose: the web favicon, the Windows .ico and the Linux PNGs
    all want the canvas filled. macOS is the exception — it needs an 824/1024
    safe-area inset — and that inset is applied when building icon.icns:

        python3 src-tauri/icons/macos-icon.gen.py

    Re-run it after changing anything below, or the Dock icon keeps the old art.
  -->
  <defs>
    <linearGradient id="raBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A90FF"/>
      <stop offset="1" stop-color="#0B4FD6"/>
    </linearGradient>
  </defs>

  <!-- blue squircle tile -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#raBg)"/>

  <!-- back diamond (rhombus plate) -->
  <polygon points="256,256 448,363 256,469 64,363" fill="#FFFFFF" opacity="0.45"/>
  <!-- middle diamond -->
  <polygon points="256,171 448,277 256,384 64,277" fill="#FFFFFF" opacity="0.7"/>
  <!-- front diamond — the code face -->
  <polygon points="256,85 448,192 256,299 64,192" fill="#FFFFFF"/>

  <!-- `</>` on the front diamond: left chevron, slash, right chevron. -->
  <polyline points="201,158 162,192 201,226"
    fill="none" stroke="#0B4FD6" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="311,158 350,192 311,226"
    fill="none" stroke="#0B4FD6" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="282" y1="149" x2="230" y2="235"
    stroke="#0B4FD6" stroke-width="28" stroke-linecap="round"/>
</svg>
